min_version = "2026.10.15"

[tools]
node = "24"
"npm:vercel" = "latest"
gh = "latest"
uv = "latest"
codex = "latest"
herdr = "latest"
perl = "latest"
"github:fish-shell/fish-shell" = { version = "latest", os = ["linux"], matching = "linux-" }

[dotfiles]
"~/.codex/config.toml/defaults" = { source = "dotfiles/codex/defaults.toml", merge = "missing" }
"~/.codex/config.toml/memories" = { source = "dotfiles/codex/memories.toml", merge = true }
"~/.codex/config.toml/desktop" = { source = "dotfiles/codex/desktop.toml", merge = true }
"~/.codex/config.toml/permissions" = { source = "dotfiles/codex/permissions.toml", merge = true }
"~/.codex/AGENTS.md" = { source = "dotfiles/codex/AGENTS.md", mode = "symlink" }
"~/.codex/rules/owner-git.rules" = { source = "dotfiles/codex/rules/owner-git.rules", mode = "symlink" }
"~/.agents/skills/engineering-craft" = { source = "dotfiles/agents/skills/engineering-craft", mode = "symlink" }
"~/.agents/skills/implement-design" = { source = "dotfiles/agents/skills/implement-design", mode = "symlink" }
"~/.agents/skills/owner-publication" = { source = "dotfiles/agents/skills/owner-publication", mode = "symlink" }
"~/.agents/skills/review-pr" = { source = "dotfiles/agents/skills/review-pr", mode = "symlink" }
"~/.agents/skills/source-verification" = { source = "dotfiles/agents/skills/source-verification", mode = "symlink" }
"~/.bash_profile/local-bin" = { line = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"', position = "prepend" }
"~/.bashrc/local-bin" = { line = 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"', position = "prepend" }
"~/.config/fish/config.fish/local-bin" = { line = 'fish_add_path --global "$HOME/.local/bin" "$HOME/.local/share/mise/shims"', position = "prepend" }
"~/.config/fish/config.fish/greeting" = { line = "set -g fish_greeting" }
"~/.bashrc/fish" = { block = '''
if [[ $- == *i* && -t 0 && -t 1 &&
      -z ${BASH_EXECUTION_STRING:-} && ${MAC_SETUP_NO_FISH:-0} != 1 ]] &&
    fish_path="$(mise -C "$HOME" which fish 2>/dev/null)"; then
    export SHELL="$fish_path"
    exec "$fish_path"
fi
''' }

[bootstrap.mise_shell_activate]
bash = true
fish = "auto"

[bootstrap.hooks]
post-tools = "~/.config/mise/scripts/rafiki-post-tools.sh"
